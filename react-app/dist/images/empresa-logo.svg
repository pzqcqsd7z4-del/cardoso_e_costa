<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Cardoso & Costa">
  <!-- Fitas brancas -->
  <path d="M 200 80 Q 180 120 200 160" stroke="white" stroke-width="25" fill="none" stroke-linecap="round"/>
  <path d="M 400 80 Q 420 120 400 160" stroke="white" stroke-width="25" fill="none" stroke-linecap="round"/>

  <!-- Casa em ouro -->
  <g>
    <!-- Telhado esquerdo -->
    <path d="M 300 100 L 220 180" stroke="#D4AF37" stroke-width="30" fill="none" stroke-linecap="round"/>
    <!-- Telhado direito -->
    <path d="M 300 100 L 380 180" stroke="#D4AF37" stroke-width="30" fill="none" stroke-linecap="round"/>

    <!-- Casa/Parede -->
    <rect x="220" y="170" width="160" height="80" fill="#D4AF37" opacity="0.3" rx="5"/>

    <!-- Porta -->
    <rect x="280" y="210" width="40" height="40" fill="none" stroke="#D4AF37" stroke-width="3" rx="3"/>

    <!-- Janelas -->
    <rect x="240" y="190" width="20" height="20" fill="none" stroke="#D4AF37" stroke-width="2" rx="2"/>
    <rect x="320" y="190" width="20" height="20" fill="none" stroke="#D4AF37" stroke-width="2" rx="2"/>
    <line x1="250" y1="190" x2="250" y2="210" stroke="#D4AF37" stroke-width="1"/>
    <line x1="240" y1="200" x2="260" y2="200" stroke="#D4AF37" stroke-width="1"/>
    <line x1="330" y1="190" x2="330" y2="210" stroke="#D4AF37" stroke-width="1"/>
    <line x1="320" y1="200" x2="340" y2="200" stroke="#D4AF37" stroke-width="1"/>
  </g>

  <!-- CARDOSO & COSTA -->
  <text x="300" y="280" font-family="Georgia, serif" font-size="48" font-weight="600" fill="#D4AF37" text-anchor="middle" letter-spacing="3">CARDOSO &amp; COSTA</text>

  <!-- CONSTRUÇÕES -->
  <text x="300" y="320" font-family="Georgia, serif" font-size="18" fill="#D4AF37" text-anchor="middle" letter-spacing="2">CONSTRUÇÕES</text>
</svg>